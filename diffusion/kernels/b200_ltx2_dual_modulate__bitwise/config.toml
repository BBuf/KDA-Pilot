[task]
slug = "b200_ltx2_dual_modulate__bitwise"
arch = "b200"
target_gpu = "NVIDIA B200"
family = "ltx2_dual_modulate"
entry_points = [
  "sglang.multimodal_gen.runtime.models.dits.ltx_2:_ltx2_try_fused_rmsnorm_dual_modulate",
  "sglang.multimodal_gen.runtime.models.dits.ltx_2:_ltx2_try_fused_rmsnorm_ca_dual_modulate",
]

[build]
language = "cuda"
destination_passing_style = true
# Upstream LTX2 dual modulation is pure PyTorch eager (RMSNormNoWeight ->
# F.rms_norm; see docs/baseline_source.md). Per the sibling precedent
# (b200_diffusion_fuse_scale_shift__multi_shape, whose config likewise exposes a
# non-CUDA upstream through baseline/binding.py), the baseline is exposed through
# local destination-passing Python launchers with the SAME ABI as the candidate.
# The candidate computes the identical F.rms_norm in PyTorch (bit-identical) and
# fuses the dual affine in CUDA (solution/kernel.cu). `language = "cuda"` refers
# to the candidate.
baseline_entry_points = [
  "baseline/binding.py::ltx2_dual_modulate_baseline",
  "baseline/binding.py::ltx2_ca_dual_modulate_from_temb_baseline",
]
candidate_entry_points = [
  "solution/kernel.cu::ltx2_dual_modulate_candidate",
  "solution/kernel.cu::ltx2_ca_dual_modulate_from_temb_candidate",
]

[correctness]
bitwise_required = true
comparison = "torch_equal"
forbid_tolerance = true
baseline = "pytorch_eager"

[benchmark]
warmup_runs = 10
iterations = 200
num_trials = 7
inner_iterations_min = 1
inner_iterations_max = 2048
target_sample_us = 1000
timeout_seconds = 900
use_isolated_runner = true
required_matched_ratio = 1.0
